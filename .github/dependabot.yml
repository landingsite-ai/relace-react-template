# Opens a PR whenever a new @aifeatures/react is published, moving the exact
# pin in package.json and package-lock.json together.
#
# Why a PR and not a version range: the Modal gold image clones this repo and
# runs `npm install` at image build, and every new site starts from that copy
# and this lockfile. A range would still resolve to whatever the lock holds, so
# the only way a release reaches new sites is a commit here. Merging the PR
# pushes main, which trigger-deploy.yml turns into a gold-image rebuild.
#
# The pin stays EXACT (versioning-strategy: increase rewrites it to the new
# exact version) because the agent runs `npm install <pkg>` inside customer
# repos, and a range would let that float a live site onto a newer 0.x.
#
# Only @aifeatures/react: every other dependency is pinned on purpose and is
# bumped deliberately, not by a bot.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@aifeatures/react"
    versioning-strategy: increase
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
    labels: []
